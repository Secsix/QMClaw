name: checks

# 只做**离线静态**检查：起服务、跑真机实验都由人控制（AGENTS.md 约定 3）。
# 真机自检（_p3_e2e / _registry_ep_check / _apply_dataset_ep_check）不进 CI。

on:
  push:
    branches: [main, master, feat/c-real-machine]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: 静态检查（Python 语法 / 文档漂移 / qwf lint）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests numpy pyyaml

      - name: 拉取上游 OpenQWF（submodule，私有仓需 token）
        id: openqwf
        shell: pwsh
        env:
          OPENQWF_TOKEN: ${{ secrets.OPENQWF_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          if (-not $env:OPENQWF_TOKEN) {
            Write-Host "::notice::没有 OPENQWF_TOKEN：跳过 qwf lint（上游 OpenQWF 是私有仓）"
            "has_upstream=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          # 把 https://github.com/ 前缀换成带 token 的等价 URL，让 submodule 能拉到私有仓
          $base = "https://x-access-token:$env:OPENQWF_TOKEN@github.com/"
          git -c "url.$base.insteadOf=https://github.com/" submodule update --init --recursive vendor/OpenQWF
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::notice::拉取上游 submodule 失败：跳过 qwf lint"
            "has_upstream=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          "has_upstream=true" >> $env:GITHUB_OUTPUT

      - name: 全仓 Python 语法（ast.parse，抓"从来没能 import"的文件）
        run: python checks/_syntax_check.py

      - name: 文档漂移（docs 路径存在性 + 自检清单与 runner 一致）
        run: python checks/_docs_paths_check.py

      - name: 前端/Express 契约（排队轮询 + 作业代理，纯文件级）
        run: python checks/_web_proxy_check.py

      - name: 仓库卫生（临时产物 / 大文件 / 私文档 / 个人路径）
        run: python checks/_repo_hygiene_check.py

      - name: qwf 离线体检（受版本控制的产品范例，必须 0 error）
        if: steps.openqwf.outputs.has_upstream == 'true'
        shell: pwsh
        run: |
          $files = @(git ls-files "qwf_examples/*.qwf" "qwf_scripts/*.qwf" "qwf_scripts/workflows/*.qwf" "qwf_scripts/experiments/*.qwf")
          if (-not $files -or $files.Count -eq 0) { Write-Host "没有 .qwf 文件"; exit 0 }
          Write-Host "lint $($files.Count) 个 .qwf"
          python qwf_lint.py @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  openqwf-drift:
    name: 上游 OpenQWF 漂移检查（submodule 指针 vs 上游仓）
    runs-on: ubuntu-latest
    # 上游是私有仓：没有 OPENQWF_TOKEN 时这一项直接跳过（不阻塞主线）。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 克隆上游并比对指针
        env:
          OPENQWF_TOKEN: ${{ secrets.OPENQWF_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          if [ -z "${OPENQWF_TOKEN:-}" ]; then
            echo "::notice::没有 OPENQWF_TOKEN，跳过上游漂移检查"
            exit 0
          fi
          BRANCH=main
          echo "上游分支：$BRANCH"
          git clone --depth 1 --branch "$BRANCH" \
            "https://x-access-token:${OPENQWF_TOKEN}@github.com/Secsix/OpenQWF.git" \
            upstream-openqwf
          python tools/check_openqwf_drift.py --from upstream-openqwf
